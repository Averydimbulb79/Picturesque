name: Windows preview
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'styles/**'
      - 'desktop/**'
      - 'tests/**'
      - 'index.html'
      - 'package*.json'
      - '.github/workflows/windows.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build unsigned Windows x64 installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Picturesque-Windows-preview
          path: dist/*Setup.exe
          if-no-files-found: error
          retention-days: 30
