<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Picturesque | Your browser image studio</title><style>
:root{color-scheme:dark;--bg:#17191e;--panel:#23262d;--line:#383d47;--accent:#a7edb3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef1f6;font:14px system-ui}button,input,select{font:inherit}button,select,input[type=number],input[type=text]{background:#30343e;color:inherit;border:1px solid var(--line);border-radius:6px;padding:8px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.4;cursor:default}button.active{background:var(--accent);color:#14231a}header{display:flex;align-items:center;gap:9px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}h1{font-size:22px;margin:0 20px 0 0;letter-spacing:-1px}h1 span{color:var(--accent)}.quiet{color:#aab2c0;font-size:12px}.workspace{display:grid;grid-template-columns:76px 1fr 268px;height:calc(100vh - 131px)}nav{padding:12px 8px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:8px}nav button{padding:10px 3px;font-size:12px}.options{padding:10px 18px;background:var(--panel);display:flex;gap:15px;align-items:center;flex-wrap:wrap}.options input[type=number]{width:74px}.options label{display:flex;align-items:center;gap:7px}#stage{overflow:auto;display:flex;align-items:flex-start;justify-content:flex-start;padding:40px;position:relative;background:radial-gradient(ellipse at center,#2b303a,#191c22)}#paper{position:relative;margin:auto;flex-shrink:0;background:repeating-conic-gradient(#ddd 0% 25%,#fff 0% 50%) 0/20px 20px;box-shadow:0 10px 55px #0008}canvas{display:block;touch-action:none}#overlay{position:absolute;inset:0;pointer-events:none}aside{background:var(--panel);padding:16px;overflow:auto;border-left:1px solid var(--line)}h2{font-size:13px;text-transform:uppercase;letter-spacing:1.3px;color:#b8c0cd;margin:18px 0 12px}aside label{display:block;margin:12px 0;font-size:12px}aside input[type=range]{width:100%;accent-color:var(--accent)}.row{display:flex;gap:6px;align-items:center;margin:8px 0}.row button{flex:1;padding:7px 3px;font-size:12px}.layer{display:flex;align-items:center;gap:8px;padding:9px 6px;border:1px solid transparent;border-radius:7px;margin:5px 0;cursor:pointer}.layer.selected{border-color:var(--accent);background:#a7edb310}.layer img{width:40px;height:32px;object-fit:contain;background:#ffffff15}.layer span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.layer button{padding:4px}.status{height:34px;display:flex;justify-content:space-between;padding:8px 18px;background:#20232a;font-size:12px;color:#b8c0cd}dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:inherit;max-width:480px}dialog::backdrop{background:#0009}dialog label{display:block;margin:15px 0}dialog input{width:100%}.primary{background:var(--accent);color:#14231a}a{color:var(--accent)}@media(max-width:850px){.workspace{grid-template-columns:65px 1fr 215px}header h1{width:100%}header{padding:8px}.workspace{height:calc(100vh - 190px)}#stage{padding:15px}aside{padding:10px}}@media(max-width:580px){.workspace{grid-template-columns:60px 1fr;height:65vh}aside{grid-column:1 / -1;border-top:1px solid var(--line);overflow:visible}.status{position:fixed;bottom:0;width:100%}body{padding-bottom:40px}.options{gap:8px;padding:8px}header button{font-size:12px;padding:6px}}
</style></head><body>
<header><h1>Picturesque<span>.</span></h1><button id="new">New canvas</button><button id="open">Open image</button><button id="import">Add image layer</button><button id="load">Open project</button><button id="save">Save project</button><button id="export" class="primary">Export image</button><button id="help">?</button></header>
<div class="options"><label>Colour <input id="color" type="color" value="#a7edb3"></label><label>Size <input id="size" type="number" min="1" max="500" value="24"></label><label>Zoom <select id="zoom"><option value="0.25">25%</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.5">150%</option><option value="2">200%</option></select></label><button id="fit">Fit</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="cropApply" hidden>Apply crop</button><button id="deselect">Deselect</button><span id="hint" class="quiet">Drag to move the selected layer</span></div>
<div class="workspace"><nav aria-label="Tools"><button data-tool="move" class="active">↖<br>Move</button><button data-tool="brush">✎<br>Brush</button><button data-tool="erase">▱<br>Eraser</button><button data-tool="select">▧<br>Select</button><button data-tool="crop">⌗<br>Crop</button><button data-tool="text">T<br>Text</button><button data-tool="rect">□<br>Box</button><button data-tool="ellipse">○<br>Ellipse</button><button data-tool="pick">◉<br>Pick</button></nav><main id="stage"><div id="paper"><canvas id="canvas" aria-label="Image editing canvas"></canvas><canvas id="overlay"></canvas></div></main><aside><h2>Layers</h2><div class="row"><button id="add">+ Layer</button><button id="duplicate">Duplicate</button><button id="delete">Delete</button></div><div id="layers"></div><div class="row"><button id="up">Move up</button><button id="down">Move down</button><button id="rename">Rename</button></div><label>Opacity <input id="opacity" type="range" min="0" max="100" value="100"></label><label>Blend mode <select id="blend"><option value="source-over">Normal</option><option>multiply</option><option>screen</option><option>overlay</option><option>darken</option><option>lighten</option></select></label><h2>Adjustments</h2><label>Brightness <input id="brightness" type="range" min="0" max="200" value="100"></label><label>Contrast <input id="contrast" type="range" min="0" max="200" value="100"></label><label>Saturation <input id="saturation" type="range" min="0" max="200" value="100"></label><div class="row"><button id="reset">Reset adjustments</button></div><h2>Transform layer</h2><div class="row"><button id="left">Rotate ↶</button><button id="right">Rotate ↷</button></div><div class="row"><button id="flipX">Flip horizontal</button><button id="flipY">Flip vertical</button></div><div class="row"><button id="scale">Resize layer</button></div><p class="quiet">Made for your everyday edits.<br>Local files. No uploads. No account needed.<br>Save a project to keep editable layers.</p></aside></div><footer class="status"><span id="status"></span><span>Picturesque · Browser image studio</span></footer>
<input type="file" id="imageFile" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/svg+xml" hidden><input type="file" id="projectFile" accept=".json,.picturesque" hidden><dialog id="dialog"><form id="form"><h2 id="dialogTitle"></h2><div id="fields"></div><div class="row"><button type="button" id="cancel">Cancel</button><button class="primary">Apply</button></div></form></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id), view=$('canvas'),ctx=view.getContext('2d'),overlay=$('overlay'),octx=overlay.getContext('2d');
let W=1200,H=800,layers=[],active=0,tool='move',selection=null,drag=null,zoom=1,history=[],future=[],importMode=false,busy=false;
function surface(w=W,h=H){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function layer(name,c=surface()){return {name,c,x:0,y:0,visible:true,opacity:1,blend:'source-over',brightness:100,contrast:100,saturation:100}}
function current(){return layers[active]}
function filter(l){return `brightness(${l.brightness}%) contrast(${l.contrast}%) saturate(${l.saturation}%)`}
function composite(target){const g=target.getContext('2d');g.clearRect(0,0,W,H);for(const l of layers){if(!l.visible)continue;g.save();g.globalAlpha=l.opacity;g.globalCompositeOperation=l.blend;g.filter=filter(l);g.drawImage(l.c,l.x,l.y);g.restore()}return target}
function render(){view.width=W;view.height=H;overlay.width=W;overlay.height=H;for(const c of [view,overlay]){c.style.width=W*zoom+'px';c.style.height=H*zoom+'px'}$('paper').style.width=W*zoom+'px';$('paper').style.height=H*zoom+'px';composite(view);outline();$('status').textContent=`${W} × ${H} px · ${layers.length} layers · ${Math.round(zoom*100)}%`; $('undo').disabled=!history.length;$('redo').disabled=!future.length}
function outline(r=selection){octx.clearRect(0,0,W,H);if(r){octx.strokeStyle='#fff';octx.lineWidth=1/zoom;octx.setLineDash([6/zoom,4/zoom]);octx.strokeRect(r.x,r.y,r.w,r.h);octx.strokeStyle='#111';octx.lineDashOffset=6/zoom;octx.strokeRect(r.x,r.y,r.w,r.h)}$('cropApply').hidden=!(selection&&tool==='crop')}
function panel(){const list=$('layers');list.replaceChildren();layers.forEach((l,i)=>{const row=document.createElement('div');row.className='layer'+(i===active?' selected':'');const b=document.createElement('button');b.textContent=l.visible?'◉':'○';b.title='Toggle visibility';b.onclick=e=>{e.stopPropagation();checkpoint();l.visible=!l.visible;refresh()};const thumb=document.createElement('img');thumb.src=l.c.toDataURL();thumb.alt='';const name=document.createElement('span');name.textContent=l.name;row.append(b,thumb,name);row.onclick=()=>{active=i;panel()};list.prepend(row)});const l=current();for(const p of ['brightness','contrast','saturation','blend'])$(p).value=l[p];$('opacity').value=l.opacity*100}
function refresh(){render();panel()}
function snapshot(){return {format:'picturesque',version:1,width:W,height:H,active,layers:layers.map(({c,...l})=>({...l,image:c.toDataURL()}))}}
function checkpoint(){history.push(snapshot());if(history.length>25)history.shift();future=[]}
async function decode(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('Could not read image'));im.src=src})}
async function restore(s){const next=await Promise.all(s.layers.map(async ({image,...l})=>{const im=await decode(image),c=surface(im.width,im.height);c.getContext('2d').drawImage(im,0,0);return {...l,c}}));W=s.width;H=s.height;layers=next;active=Math.min(s.active||0,layers.length-1);selection=null;refresh()}
async function travel(from,to){if(!from.length||busy)return;busy=true;to.push(snapshot());try{await restore(from.pop())}finally{busy=false}}
function bounds(a,b){return {x:Math.round(Math.min(a.x,b.x)),y:Math.round(Math.min(a.y,b.y)),w:Math.round(Math.abs(a.x-b.x)),h:Math.round(Math.abs(a.y-b.y))}}
function point(e){const r=view.getBoundingClientRect();return {x:(e.clientX-r.left)/zoom,y:(e.clientY-r.top)/zoom}}
function drawStroke(a,b){const l=current(),g=l.c.getContext('2d');g.save();if(selection){g.beginPath();g.rect(selection.x-l.x,selection.y-l.y,selection.w,selection.h);g.clip()}g.globalCompositeOperation=tool==='erase'?'destination-out':'source-over';g.strokeStyle=$('color').value;g.fillStyle=$('color').value;g.lineWidth=+$('size').value||1;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(a.x-l.x,a.y-l.y);g.lineTo(b.x-l.x,b.y-l.y);g.stroke();if(a.x===b.x&&a.y===b.y){g.beginPath();g.arc(a.x-l.x,a.y-l.y,g.lineWidth/2,0,Math.PI*2);g.fill()}g.restore()}
function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));$('hint').textContent=({move:'Drag to move the selected layer',brush:'Paint on the selected layer',erase:'Erase pixels on the selected layer',select:'Drag a rectangular selection; brush and eraser stay inside it',crop:'Drag a crop area, then click Apply crop',text:'Click the canvas to add text',rect:'Drag to draw a filled box',ellipse:'Drag to draw a filled ellipse',pick:'Click to sample a colour'})[t];outline()}
view.onpointerdown=e=>{if(busy)return;const p=point(e);if(tool==='text'){ask('Add text',[['text','Text','text','Hello, beautiful.'],['font','Font size','number',64]],v=>{checkpoint();const c=surface(),g=c.getContext('2d');g.font=`${Math.max(1,Math.min(1000,+v.font))}px sans-serif`;g.fillStyle=$('color').value;g.fillText(v.text,p.x,p.y);layers.push(layer(v.text.slice(0,24)||'Text',c));active=layers.length-1;refresh()});return}if(tool==='pick'){const d=ctx.getImageData(Math.min(W-1,Math.max(0,Math.floor(p.x))),Math.min(H-1,Math.max(0,Math.floor(p.y))),1,1).data;$('color').value='#'+[...d].slice(0,3).map(v=>v.toString(16).padStart(2,'0')).join('');return}view.setPointerCapture(e.pointerId);drag={start:p,last:p,x:current().x,y:current().y};if(['move','brush','erase','rect','ellipse'].includes(tool))checkpoint();if(['brush','erase'].includes(tool)){drawStroke(p,p);render()}};
view.onpointermove=e=>{if(!drag)return;const p=point(e);if(tool==='move'){current().x=Math.round(drag.x+p.x-drag.start.x);current().y=Math.round(drag.y+p.y-drag.start.y);render()}else if(['brush','erase'].includes(tool)){drawStroke(drag.last,p);render()}else outline(bounds(drag.start,p));drag.last=p};
function finish(){if(!drag)return;const r=bounds(drag.start,drag.last);if(['select','crop'].includes(tool)){selection=r.w&&r.h?r:null}else if(['rect','ellipse'].includes(tool)){const l=current(),g=l.c.getContext('2d');g.save();if(selection){g.beginPath();g.rect(selection.x-l.x,selection.y-l.y,selection.w,selection.h);g.clip()}g.fillStyle=$('color').value;if(tool==='rect')g.fillRect(r.x-l.x,r.y-l.y,r.w,r.h);else{g.beginPath();g.ellipse(r.x-l.x+r.w/2,r.y-l.y+r.h/2,r.w/2,r.h/2,0,0,Math.PI*2);g.fill()}g.restore()}drag=null;refresh()}
view.onpointerup=finish;view.onpointercancel=finish;
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
function ask(title,fields,done){$('dialogTitle').textContent=title;$('fields').replaceChildren();for(const [id,label,type,value]of fields){const el=document.createElement('label');el.textContent=label;const input=document.createElement('input');input.name=id;input.type=type;input.value=value;input.required=true;el.append(input);$('fields').append(el)}$('form').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData($('form')));$('dialog').close();try{done(v)}catch(err){alert(err.message)}};$('dialog').showModal()}
$('cancel').onclick=()=>$('dialog').close();
function newDoc(w,h,bg){W=w;H=h;const c=surface();if(bg){const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H)}layers=[layer(bg?'Background':'Layer 1',c)];active=0;selection=null;refresh();fit()}
function validSize(w,h){if(!Number.isInteger(w)||!Number.isInteger(h)||w<1||h<1||w>8192||h>8192||w*h>24000000)throw new Error('Use whole dimensions from 1 to 8192 pixels, up to 24 million pixels total.')}
$('new').onclick=()=>ask('New canvas',[['width','Width (px)','number',1200],['height','Height (px)','number',800]],v=>{const w=+v.width,h=+v.height;validSize(w,h);checkpoint();newDoc(w,h,false)});
$('open').onclick=()=>{importMode=false;$('imageFile').click()};$('import').onclick=()=>{importMode=true;$('imageFile').click()};
$('imageFile').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;const url=URL.createObjectURL(file);try{const im=await decode(url);validSize(im.width,im.height);checkpoint();if(!importMode){W=im.width;H=im.height;layers=[];selection=null}const c=surface(im.width,im.height);c.getContext('2d').drawImage(im,0,0);layers.push(layer(file.name,c));active=layers.length-1;refresh();fit()}catch(err){alert(err.message)}finally{URL.revokeObjectURL(url)}};
$('add').onclick=()=>{checkpoint();layers.push(layer('Layer '+(layers.length+1)));active=layers.length-1;refresh()};$('duplicate').onclick=()=>{checkpoint();const l=current(),c=surface(l.c.width,l.c.height);c.getContext('2d').drawImage(l.c,0,0);layers.splice(active+1,0,{...l,c,name:l.name+' copy'});active++;refresh()};$('delete').onclick=()=>{checkpoint();layers.splice(active,1);if(!layers.length)layers.push(layer('Layer 1'));active=Math.min(active,layers.length-1);refresh()};
for(const [id,d] of [['up',1],['down',-1]])$(id).onclick=()=>{const next=active+d;if(next<0||next>=layers.length)return;checkpoint();[layers[active],layers[next]]=[layers[next],layers[active]];active=next;refresh()};$('rename').onclick=()=>ask('Rename layer',[['name','Layer name','text',current().name]],v=>{checkpoint();current().name=v.name;refresh()});
for(const id of ['brightness','contrast','saturation','opacity']){$(id).onpointerdown=()=>checkpoint();$(id).onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End','ArrowUp','ArrowDown'].includes(e.key))checkpoint()};$(id).oninput=()=>{current()[id]=+$(id).value/(id==='opacity'?100:1);render()}}$('blend').onchange=()=>{checkpoint();current().blend=$('blend').value;render()};$('reset').onclick=()=>{checkpoint();for(const id of ['brightness','contrast','saturation'])current()[id]=100;refresh()};
function transform(kind,factor=1){checkpoint();const l=current(),old=l.c;const turn=kind==='left'||kind==='right';const c=surface(turn?old.height:Math.max(1,Math.round(old.width*factor)),turn?old.width:Math.max(1,Math.round(old.height*factor)));const g=c.getContext('2d');g.translate(c.width/2,c.height/2);if(turn)g.rotate((kind==='left'?-1:1)*Math.PI/2);if(kind==='flipX')g.scale(-1,1);if(kind==='flipY')g.scale(1,-1);g.drawImage(old,-(turn?old.width:c.width)/2,-(turn?old.height:c.height)/2,turn?old.width:c.width,turn?old.height:c.height);l.x+=Math.round((old.width-c.width)/2);l.y+=Math.round((old.height-c.height)/2);l.c=c;refresh()}
for(const id of ['left','right','flipX','flipY'])$(id).onclick=()=>transform(id);$('scale').onclick=()=>ask('Resize selected layer',[['percent','Scale (%)','number',100]],v=>{const f=+v.percent/100;validSize(Math.round(current().c.width*f),Math.round(current().c.height*f));transform('scale',f)});
$('cropApply').onclick=()=>{if(!selection)return;const r=selection,x=Math.max(0,r.x),y=Math.max(0,r.y),w=Math.min(W,r.x+r.w)-x,h=Math.min(H,r.y+r.h)-y;if(w<1||h<1)return;checkpoint();for(const l of layers){const c=surface(w,h);c.getContext('2d').drawImage(l.c,l.x-x,l.y-y);l.c=c;l.x=l.y=0}W=w;H=h;selection=null;refresh();fit()};$('deselect').onclick=()=>{selection=null;outline()};
$('undo').onclick=()=>travel(history,future);$('redo').onclick=()=>travel(future,history);$('zoom').onchange=()=>{zoom=+$('zoom').value;render()};function fit(){zoom=Math.max(.05,Math.min(1,($('stage').clientWidth-80)/W,($('stage').clientHeight-80)/H));render()}$('fit').onclick=fit;
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
$('save').onclick=()=>download(new Blob([JSON.stringify(snapshot())],{type:'application/json'}),'Picturesque.picturesque');$('load').onclick=()=>$('projectFile').click();$('projectFile').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;busy=true;try{if(file.size>150000000)throw new Error('Project file too large');const s=JSON.parse(await file.text());if(s.format!=='picturesque'||s.version!==1||!Array.isArray(s.layers)||!s.layers.length||s.layers.length>50)throw new Error('This is not a supported Picturesque project');validSize(s.width,s.height);for(const l of s.layers){if(typeof l.image!=='string'||!l.image.startsWith('data:image/png;base64,')||typeof l.name!=='string'||![l.x,l.y,l.opacity,l.brightness,l.contrast,l.saturation].every(Number.isFinite))throw new Error('Invalid project layer')}const before=snapshot();await restore(s);history.push(before);future=[];fit()}catch(err){alert('Could not open project: '+err.message)}finally{busy=false}};
$('export').onclick=()=>ask('Export image',[['name','Filename (without extension)','text','Picturesque'],['format','Format: png, jpeg, or webp','text','png']],v=>{const format=v.format.toLowerCase();if(!['png','jpeg','webp'].includes(format))throw new Error('Choose png, jpeg, or webp.');const c=surface();composite(c);if(format==='jpeg'){const g=c.getContext('2d');g.globalCompositeOperation='destination-over';g.fillStyle='#fff';g.fillRect(0,0,W,H)}c.toBlob(blob=>{if(blob)download(blob,v.name+'.'+(format==='jpeg'?'jpg':format))},'image/'+format,.94)});
$('help').onclick=()=>{ $('dialogTitle').textContent='Welcome to Picturesque';$('fields').textContent='Open an image or start with a transparent canvas. Add layers for brush strokes, shapes, and text. Move drags the active layer. Select limits brush and eraser strokes. Crop changes the whole canvas. Adjustments affect the selected layer. Save project keeps all layers; export flattens the visible result. Text is rasterised after adding. Keyboard: Ctrl/Cmd+Z undo, Ctrl/Cmd+Shift+Z redo, B brush, V move, E eraser, T text, C crop, M select, Escape deselect. PNG export preserves transparency. JPEG uses a white background. PSD files are not supported in this first version.';$('form').onsubmit=e=>{e.preventDefault();$('dialog').close()};$('dialog').showModal()};
document.onkeydown=e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||$('dialog').open)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();travel(e.shiftKey?future:history,e.shiftKey?history:future)}else if(e.key==='Escape'){selection=null;outline()}else if(!e.ctrlKey&&!e.metaKey){const t={b:'brush',v:'move',e:'erase',t:'text',c:'crop',m:'select'}[e.key.toLowerCase()];if(t)setTool(t)}};
newDoc(1200,800,false);
</script></body></html>
